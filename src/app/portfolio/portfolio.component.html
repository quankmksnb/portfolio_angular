<section class="home">
  <app-nav></app-nav>
  <!-- Main content -->
  <section class="container">
    <section
      class="row justify-content-between align-items-center profile-intro"
    >
      <div class="col-lg-6 col-md-12 intro-text order-2 order-lg-1">
        <h1>{{ info.name }}</h1>
        <p>{{ info.intro }}</p>
        <button appButton type="button">
          Let’s get started
          <svg
            width="6"
            height="11"
            viewBox="0 0 6 11"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M5.63335 4.87364L1.51379 0.759206C1.16776 0.413598 0.605566 0.413598 0.259528 0.759206C-0.0865095 1.10481 -0.0865095 1.66631 0.259528 2.01191L3.75196 5.5L0.259528 8.9881C-0.0865095 9.3337 -0.0865095 9.8952 0.259528 10.2408C0.432545 10.4136 0.65957 10.5 0.886652 10.5C1.11373 10.5 1.34078 10.4136 1.51378 10.2408L5.63333 6.12637C5.97937 5.78076 5.97937 5.21927 5.63333 4.87366L5.63335 4.87364Z"
              fill="white"
            />
          </svg>
        </button>
      </div>
      <div class="col-lg-6 col-md-12 portrait-img order-1 order-lg-2">
        <img src="assets/img/a_one.png" alt="Portrait" class="rounded-circle" />
      </div>
    </section>

    <div class="worked-with">
      <h6>Worked with</h6>
      <swiper-container
        class="worked-with-swiper"
        slides-per-view="2"
        slides-per-group="2"
        space-between="10"
        loop="true"
        autoplay='{"delay": 2000, "disableOnInteraction": false}'
        breakpoints='{
          "0": {
            "slidesPerView": 1, 
            "slidesPerGroup": 1,
            "spaceBetween": 10,
            "autoplay": {"delay": 2000, "disableOnInteraction": false},
            "pagination": {"clickable": true}
          },
          "451": {
            "slidesPerView": 2, 
            "slidesPerGroup": 2,
            "spaceBetween": 10,
            "autoplay": {"delay": 2000, "disableOnInteraction": false},
            "pagination": {"clickable": true}
          },
          "992": {
            "slidesPerView": 5, 
            "slidesPerGroup": 5,
            "spaceBetween": 20,
            "autoplay": false,
            "pagination": false,
            "allowTouchMove": false
          }
        }'
      >
        @for(logo of listLogo; track logo){
        <swiper-slide>
          <div class="company-logo">
            <img
              [src]="logo.href"
              [alt]="logo.title"
              [width]="logo.width"
              [height]="logo.height"
            />
          </div>
        </swiper-slide>
        }
        <div class="swiper-pagination mt-3 work-with-pagination"></div>
      </swiper-container>
    </div>
  </section>
</section>
